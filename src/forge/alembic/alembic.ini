[alembic]
script_location = %(here)s
# URL is supplied at runtime: forge.store.run_migrations sets it
# programmatically. No fallback here — the standalone `alembic` CLI would
# otherwise silently create a CWD-relative sqlite:///forge.db in the wrong
# place (see forge.store.get_store_url / FORGE_DB_URL for the real source).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
