name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: mypy sax-llm (strict, T2.3b)
        working-directory: libs/sax-llm
        run: uv run mypy
      - name: mypy ocr (strict, T2.3c)
        working-directory: apps/ocr
        run: uv run mypy
      - name: mypy pbook (strict, T2.3d)
        working-directory: apps/pbook
        run: uv run mypy
      - name: mypy sax-platform (strict, T3.1)
        working-directory: libs/sax-platform
        run: uv run mypy
      - run: uv run lint-imports

  test-forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # forge's exploration provider (handle_search_code) shells out to rg
      - run: sudo apt-get install -y --no-install-recommends ripgrep
      - run: uv python install
      - run: uv sync --locked --all-packages
      - run: uv run pytest

  test-pbook:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pbook
          POSTGRES_DB: pbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PBOOK_TEST_DATABASE_URL: postgresql+psycopg://postgres:pbook@localhost:5432/pbook
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - name: Run pbook tests
        working-directory: apps/pbook
        run: uv run pytest

  test-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - name: Run ocr tests
        working-directory: apps/ocr
        run: uv run pytest

  test-sax-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - name: Run sax-llm tests
        working-directory: libs/sax-llm
        run: uv run pytest

  test-sax-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - name: Run sax-platform tests
        working-directory: libs/sax-platform
        run: uv run pytest

  test-postgres-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-packages
      - run: uv run pytest -m postgres --no-cov
