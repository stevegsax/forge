# nginx as a gRPC reverse proxy that terminates mutual TLS in front of the
# Temporal frontend. This is THE security boundary: only a client presenting a
# certificate signed by client-ca.crt completes the handshake; everyone else is
# rejected before a single gRPC byte reaches Temporal. Temporal itself stays on
# the private docker network (plaintext, never published to the internet).
#
# Files expected in /etc/nginx/certs (mounted from /etc/forge/certs):
#   server.crt / server.key  — the gateway's server cert (signed by server CA)
#   client-ca.crt            — the CA whose certs are accepted from clients

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/temporal-access.log;
    error_log  /var/log/nginx/temporal-error.log warn;

    upstream temporal_frontend {
        server temporal:7233;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- Server TLS (encryption) ---
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:TemporalTLS:10m;
        ssl_session_timeout 10m;

        # --- Mutual TLS (authentication) ---
        # Require a client certificate signed by the client CA. This is the
        # "only authorized users" gate; `on` rejects any missing/invalid cert.
        ssl_client_certificate /etc/nginx/certs/client-ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        # --- gRPC tuning for Temporal ---
        # Temporal long-polls task queues (~60-70s) and keeps long-lived HTTP/2
        # connections; give generous timeouts and allow large payloads (up to
        # Temporal's ~2-4MB limit) plus headroom.
        grpc_read_timeout    3600s;
        grpc_send_timeout    3600s;
        grpc_socket_keepalive on;
        client_body_timeout  3600s;
        client_max_body_size 16m;

        location / {
            grpc_pass grpc://temporal_frontend;
            # Forward the authenticated identity for audit in Temporal logs.
            grpc_set_header X-Forwarded-Client-CN $ssl_client_s_dn;
        }

        # Health/diagnostic: a request without a client cert never reaches here
        # (handshake fails first), but return a clean gRPC-ish error just in case.
        error_page 495 496 497 = @cert_required;
        location @cert_required {
            return 403 "client certificate required\n";
        }
    }
}
