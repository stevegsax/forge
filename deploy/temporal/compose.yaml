# Temporal stack for the Forge EC2 instance.
#
#   temporal          self-hosted Temporal, persistence in Supabase Postgres.
#                     Published ONLY to 127.0.0.1:7233 for the on-box workers;
#                     never exposed to the internet.
#   temporal-ui       web UI, bound to localhost; reach it via an SSM tunnel.
#   temporal-gateway  nginx gRPC reverse proxy doing mutual TLS on :443. This
#                     is the ONLY service published to the internet, and it
#                     rejects any client without a CA-signed certificate.
#
# Remote CLIs connect to  <public-dns>:443  (mTLS).
# On-box workers connect to  127.0.0.1:7233 (plaintext, loopback-only).
#
# Values come from ./.env (generated at boot from SSM — see deploy/scripts).
name: forge-temporal

services:
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:7233:7233"   # loopback only — for the host workers
    environment:
      DB: postgres12
      POSTGRES_SEEDS: ${SUPABASE_HOST}
      DB_PORT: "5432"            # Supabase DIRECT connection, not the 6543 pooler
      POSTGRES_USER: ${SUPABASE_USER}
      POSTGRES_PWD: ${SUPABASE_TEMPORAL_PWD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SQL_TLS_ENABLED: "true"   # TLS to Supabase
      ENABLE_ES: "false"
      SQL_MAX_CONNS: "10"
      # After the FIRST successful boot (schema created), set this to stop
      # auto-setup from re-running schema setup on every restart:
      # SKIP_SCHEMA_SETUP: "true"

  temporal-ui:
    image: temporalio/ui:2.31.0
    restart: unless-stopped
    depends_on: [temporal]
    ports:
      - "127.0.0.1:8080:8080"   # loopback only — reach via SSM port-forward
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  temporal-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [temporal]
    ports:
      - "0.0.0.0:443:443"       # the only internet-facing port (mTLS-gated)
    volumes:
      - ./nginx/temporal-grpc.conf:/etc/nginx/nginx.conf:ro
      - /etc/forge/certs:/etc/nginx/certs:ro
