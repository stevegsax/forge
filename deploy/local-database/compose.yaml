# Local development stack for Forge, run under rootless podman: PostgreSQL
# (the store) + MinIO (S3-compatible object storage for the blob path).
#
# Production runs Forge's store on Supabase Postgres and blobs on AWS S3 (see
# deploy/README.md and docs/operations/DEPLOYMENT.md); the default test suite
# runs on temp-file SQLite and mocks S3 in-process with moto, and the opt-in
# `-m postgres` suite spins up its own throwaway testcontainer. This stack is
# the standing, developer-facing counterpart: a real Postgres and a real S3 API
# on loopback so you can run the worker/CLI against the same surfaces as
# production. It is NOT required by the test suite.
#
# The app connects via the single required env var FORGE_DB_URL, e.g.
#   FORGE_DB_URL=postgresql+psycopg2://forge:forge@localhost:5433/forge_dev
# (psycopg2 driver — Forge is synchronous; see .env.example). The host port
# defaults to 5433 (not 5432) so this coexists with another local Postgres —
# e.g. a sibling project's dev DB already on 5432; override via FORGE_PG_PORT.
#
# Image: pgvector/pgvector:pg16 — the Postgres 16 engine the migration
# testcontainer already validates against, plus the pgvector extension so one
# local database forward-fits the migration's Phase 6 (pbook needs pgvector).
# Forge's own schema uses no extensions, so plain postgres:16 would also work.
#
# Data is bind-mounted to a host path so it survives container rebuilds. Via
# `make db-up` the path defaults to ${XDG_DATA_HOME}/forge/postgres (XDG Base
# Directory spec). When `podman compose` is invoked directly it falls back to
# ./data/postgres beside this file (gitignored).
#
# The pgvector image is Debian-based and runs postgres as uid 999. Under
# rootless podman that uid maps to a subuid the host user can't easily touch,
# so `userns_mode: keep-id:uid=999,gid=999` maps the in-container postgres
# user back to the host user; the bind-mount dir then just needs to be owned
# by you (it is — `make db-up` mkdir's it as your user).
name: forge-postgres

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_dev
    ports:
      # Loopback only — never exposed off-box. Host port defaults to 5433 (not
      # 5432) so this coexists with another local Postgres already publishing
      # 5432 (e.g. a sibling project's dev DB); override via FORGE_PG_PORT.
      - "127.0.0.1:${FORGE_PG_PORT:-5433}:5432"
    userns_mode: "keep-id:uid=999,gid=999"
    volumes:
      - ${FORGE_PG_DATA:-./data/postgres}:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  # S3-compatible object storage for Forge's blob path (OCR request/result and
  # image/file blobs via forge_contracts.s3_blobs, keyed under
  # FORGE_OCR_S3_BUCKET). Forge's boto3 client (`boto3.client("s3")`) is pointed
  # here with NO code change by setting AWS_ENDPOINT_URL_S3=http://localhost:<port>
  # plus matching AWS creds — botocore honors that env var and uses path-style
  # addressing. Tests still mock S3 in-process with moto; this exists to run the
  # app against a real S3 API. Credentials are throwaway literals consumed only
  # by this container. Host ports default to 9002/9003 (not 9000/9001) so this
  # coexists with a sibling project's MinIO already on 9000.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: forge-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: forge
      MINIO_ROOT_PASSWORD: forge-minio-secret
    ports:
      - "127.0.0.1:${FORGE_MINIO_PORT:-9002}:9000"           # S3 API
      - "127.0.0.1:${FORGE_MINIO_CONSOLE_PORT:-9003}:9001"   # web console
    volumes:
      - ${FORGE_MINIO_DATA:-./data/minio}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: wait for MinIO, then create the bucket FORGE_OCR_S3_BUCKET names
  # (default below). `mc mb --ignore-existing` makes re-runs idempotent. It
  # reaches MinIO over the compose network (service name `minio`), so it does
  # not depend on the published host port.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: forge-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 forge forge-minio-secret >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing "local/${FORGE_OCR_S3_BUCKET:-saxcapital-forge-blobs-dev}"
