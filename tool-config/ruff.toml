src = ["src"]
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[lint.isort]
known-first-party = ["forge"]

[lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime, so imports used only as field
# types must stay at module scope (not moved into a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
