[project]
name = "forge-contracts"
description = "Shared wire contracts and platform primitives for Forge and its consumer apps (OCR, etc.)"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0",
    "temporalio>=1.9.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/forge_contracts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_contracts"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=forge_contracts --cov-report=term-missing --cov-fail-under=85"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.mypy]
python_version = "3.14"
files = ["src/forge_contracts"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

# boto3 ships no py.typed marker / stubs; treat its imports as untyped at this
# boundary (same pattern as the root pyproject's networkx override). No
# boto3-stubs dependency is added — out of scope for this task.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true
