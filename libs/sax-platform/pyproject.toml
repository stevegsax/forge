[project]
name = "sax-platform"
version = "0.1.0"
description = "Platform library: LLM client (sync + batch lanes, structured outputs) — grows into the D89 sax_platform consolidation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "anthropic>=0.40.0",
    # sax_platform.ocr targets the 1.x `from mistralai import Mistral` API.
    # mistralai 2.x is an incompatible SDK rewrite, and the 2.3.1 wheel installs
    # without a top-level package (no __init__.py), so it is unimportable.
    "mistralai>=1.0.0,<2",
    # Plumbing absorbed from forge-contracts (T3.4): contracts, temporal, db.
    "sqlalchemy>=2.0",
    "temporalio>=1.9.0",
    "boto3>=1.34",
    "alembic>=1.14",
    # New in T3.4: config groups + embeddings.
    "pydantic-settings>=2.6.0",
    "openai>=2.31.0",
    "numpy>=2.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sax_platform"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sax_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sax_platform --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.14"
files = ["src/sax_platform"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

# boto3 ships no py.typed marker / stubs; treat its imports as untyped at this
# boundary (same pattern as the root pyproject's networkx override). Ported
# from forge-contracts with sax_platform.contracts.s3_blobs (T3.4).
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]
