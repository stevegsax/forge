[project]
name = "sax-platform"
version = "0.1.0"
description = "Platform library: LLM client (sync + batch lanes, structured outputs) — grows into the D89 sax_platform consolidation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sax_platform"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sax_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sax_platform --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.14"
files = ["src/sax_platform"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]
