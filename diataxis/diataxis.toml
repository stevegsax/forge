[project]
name = "Forge"
description = "Human-facing documentation for Forge, a batch-first LLM task orchestrator. Covers the core orchestration pipeline end-to-end, plus extensions (OCR, evaluation, knowledge extraction, transcript ingestion) that build on the core."
purpose = """Most LLM orchestrators are thin wrappers around a chat loop: the model decides what to do next, the orchestrator serves the conversation, and every call depends on the conversation history that precedes it. That approach ties execution to a live connection, leaves the LLM in control of the workflow, and is incompatible with batch APIs. Forge inverts the relationship. The orchestrator owns the control loop, the LLM is a stateless function, and every call is a self-contained document completion that a batch API can process at half the cost. This documentation explains how that inversion works in practice: how tasks are decomposed and planned, how context is assembled fresh for every call, how structured output is validated and retried with error feedback, how knowledge extraction and transcript ingestion feed lessons back into future task contexts, and how the whole pipeline fits together around Temporal workflows. The audience is developers who need to create, debug, or extend Forge workflows — not end users of a deployed Forge instance."""
type = "project-docs"
audience = "Internal developers who create or debug Forge workflows"
prerequisites = "Basic understanding of Python, Temporal (https://docs.temporal.io/), LLM prompting, Jinja-style templates, batch processing patterns, and OCR concepts. This documentation assumes familiarity with these foundations and links to official external docs rather than re-explaining them."

# =============================================================================
# Topic 1: System Overview
# =============================================================================

[topics.system-overview]
title = "System Overview"
description = "What Forge is, the core principles that drive its design, and how the major components fit together."
complexity = "beginner"
order = 1

[topics.system-overview.explanation]
file = "explanation/system-overview.md"
status = "draft"
covers = [
    "What problem Forge solves and why it exists",
    "The batch-first, document-completion paradigm vs. chat-based orchestrators",
    "The seven architecture principles and their practical consequences",
    "How the major components relate: CLI, Temporal workflows, activities, code intelligence, observability store",
    "The concept of task-agnostic orchestration — same pipeline, different prompts",
    "Plan-then-execute model vs. future dynamic task evolution",
]
detail = """High-level orientation piece. A developer reading this should come away with a mental map of the system — what the moving parts are, what philosophy connects them, and where to look for details. No code, no CLI commands. Include at least one mermaid diagram showing how the major components (CLI, Temporal workflows, activities, code intelligence, observability store) connect."""
guidance = """This is the first thing a new team member reads. Keep it grounded in 'why' — why batch mode, why document completion, why Temporal, why human-gated merges. Connect each principle to the concrete consequence it has for how the system works. Make the plan-then-execute-vs-future-dynamic-evolution contrast explicit: today the planner commits the full decomposition upfront; the deferred transition signals (new_tasks_discovered, blocked_on_human, blocked_on_sibling) exist for a future dynamic model but are not implemented. Link to the golden-path tutorial for 'seeing it in action' and to the workflow-step explanation for the central abstraction. Link to Temporal docs (https://docs.temporal.io/) for Temporal background."""

[topics.system-overview.reference]
file = "reference/system-overview.md"
status = "draft"
covers = [
    "Architecture principles table (principle, consequence, enforcement point)",
    "Module map — every package and top-level module with a one-line description",
    "Technology stack table (component, technology, version/source)",
    "Environment variables table (all FORGE_* and XDG vars, defaults, effects)",
    "File system layout (config, state, logs, database)",
]
detail = """Tabular reference. One table per section. No narrative prose beyond brief introductions to each table."""
guidance = """Mirror the structure of the codebase — the module map should follow the directory tree. Keep descriptions to one line. Link to topic-specific reference docs for details on each module's contents."""

