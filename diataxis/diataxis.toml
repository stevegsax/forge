[project]
name = "Forge"
description = "Human-facing documentation for Forge, a batch-first LLM task orchestrator. Covers the core orchestration pipeline end-to-end, plus extensions (OCR, evaluation, knowledge extraction) that build on the core."
type = "project-docs"
audience = "Internal developers who create or debug Forge workflows"
prerequisites = "Basic understanding of Python, Temporal (https://docs.temporal.io/), LLM prompting, Jinja-style templates, batch processing patterns, and OCR concepts. This documentation assumes familiarity with these foundations and links to official external docs rather than re-explaining them."

# =============================================================================
# Topic 1: System Overview
# =============================================================================

[topics.system-overview]
title = "System Overview"
description = "What Forge is, the core principles that drive its design, and how the major components fit together."
complexity = "beginner"
order = 1

[topics.system-overview.explanation]
file = "explanation/system-overview.md"
status = "draft"
covers = [
    "What problem Forge solves and why it exists",
    "The batch-first, document-completion paradigm vs. chat-based orchestrators",
    "The seven architecture principles and their practical consequences",
    "How the major components relate: CLI, Temporal workflows, activities, code intelligence, observability store",
    "The concept of task-agnostic orchestration — same pipeline, different prompts",
    "Plan-then-execute model vs. future dynamic task evolution",
]
detail = """High-level orientation piece. A developer reading this should come away with a mental map of the system — what the moving parts are, what philosophy connects them, and where to look for details. No code, no CLI commands. Diagrams showing component relationships are encouraged."""
guidance = """This is the first thing a new team member reads. Keep it grounded in 'why' — why batch mode, why document completion, why Temporal, why human-gated merges. Connect each principle to the concrete consequence it has for how the system works. Link to the golden-path tutorial for 'seeing it in action' and to the workflow-step explanation for the central abstraction. Link to Temporal docs (https://docs.temporal.io/) for Temporal background."""

[topics.system-overview.reference]
file = "reference/system-overview.md"
status = "draft"
covers = [
    "Architecture principles table (principle, consequence, enforcement point)",
    "Module map — every package and top-level module with a one-line description",
    "Technology stack table (component, technology, version/source)",
    "Environment variables table (all FORGE_* and XDG vars, defaults, effects)",
    "File system layout (config, state, logs, database)",
]
detail = """Tabular reference. One table per section. No narrative prose beyond brief introductions to each table."""
guidance = """Mirror the structure of the codebase — the module map should follow the directory tree. Keep descriptions to one line. Link to topic-specific reference docs for details on each module's contents."""

# =============================================================================
# Topic 2: Golden Path — End-to-End Walkthrough
# =============================================================================

[topics.golden-path]
title = "The Golden Path: A Planned Task End-to-End"
description = "Step-by-step walkthrough of a planned, multi-step code generation task from CLI submission through committed output."
complexity = "beginner"
prerequisites = ["system-overview"]
order = 2

[topics.golden-path.tutorials]
file = "tutorials/golden-path.md"
status = "draft"
covers = [
    "Submitting a planned task via the CLI",
    "Observing the planner decompose the task into steps",
    "Watching context assembly discover relevant files",
    "Seeing the exploration loop request additional context",
    "Examining the assembled prompt sent to the LLM",
    "Tracing structured output through edit application",
    "Watching validation run and a retry with error feedback",
    "Seeing the final commit in the worktree",
    "Inspecting the run with forge status --verbose",
]
detail = """End-to-end narrative walkthrough using a concrete, realistic example (e.g., adding a new CLI command to an existing Python project). Each step shows the actual CLI command or observable output, then briefly states what happened internally. Show results at every step — never more than 2-3 actions without visible output. The tutorial should take ~20 minutes to read and follow."""
guidance = """This is the single most important document in the set. It is the reader's first hands-on encounter with Forge. Use a concrete example task, not abstract placeholders. Show real CLI output (simplified if needed). After each major phase, include a brief callout like 'For more on how context assembly works, see [Context Assembly](../explanation/context-assembly.md)' — but do NOT explain the internals inline. The tutorial shows what happens; the explanations explain why. Include a 'What you built' section at the end summarizing what was accomplished. Include a 'Where to go next' section linking to the execution-modes explanation and how-to guides."""

