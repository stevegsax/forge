[project]
name = "pbook"
version = "0.1.0"
description = "Knowledge playbook service — pitfalls, curated advice, and API doc records"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "click>=8.1.0",
    "temporalio>=1.9.0",
    "sax-llm",
    "openai>=2.31.0",
    "numpy>=2.4.4",
]

[tool.uv.sources]
sax-llm = { path = "../sax-llm", editable = true }

[project.scripts]
pbook = "pbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbook"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Workflows import models inside `workflow.unsafe.imports_passed_through()`
# for Temporal's runtime deserialization — they're used at runtime, not
# just as type hints. Ruff's TCH rules can't see through the context
# manager, so suppress the false positives in workflow files.
"src/pbook/workflows/*.py" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=pbook --cov-report=term-missing --cov-fail-under=84"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
