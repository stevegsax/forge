[project]
name = "ocr"
version = "0.1.1"
description = "OCR application: document OCR via Mistral batch, consuming the Forge platform"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "click>=8.1.0",
    "mistralai>=1.0.0",
    "pymupdf>=1.27.2",
    "psycopg2-binary>=2.9",
    "forge-contracts",
]

[project.scripts]
ocr = "ocr.cli:main"

[tool.uv.sources]
forge-contracts = { path = "../forge/libs/forge-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Workflows import models inside workflow.unsafe.imports_passed_through() for
# Temporal's runtime deserialization — used at runtime, not just as type hints.
"src/ocr/workflow_*.py" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not postgres and not e2e'"
markers = [
    "postgres: requires a real Postgres (testcontainers); excluded by default",
    "e2e: end-to-end tests requiring real services (Mistral, S3, Temporal + a running forge platform worker); excluded by default",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "moto[s3]>=5.0",
    "ruff>=0.8.0",
    "testcontainers>=4.0",
]
