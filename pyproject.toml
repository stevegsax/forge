[project]
name = "forge"
version = "0.1.0"
description = "LLM task orchestrator with batch mode execution, planning, and parallel decomposition"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "anthropic>=0.40.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "click>=8.1.0",
    "grimp>=3.5",
    "networkx>=3.0",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "sax-llm",
    "pbook",
    "forge-contracts",
]

[tool.uv.workspace]
members = ["apps/pbook"]

[tool.uv.sources]
# Root sources apply to all workspace members (members declare no
# [tool.uv.sources] of their own). The ../ path sources are not portable
# outside a sibling checkout (Finding A, D98) — each retires as its
# sibling is absorbed into the workspace.
sax-llm = { path = "../sax-llm", editable = true }
pbook = { workspace = true }
forge-contracts = { path = "../forge-contracts", editable = true }

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".direnv",
    ".venv",
    ".forge-worktrees",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime, so imports used only as field
# types must stay at module scope (not moved into a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=forge --cov-report=term-missing --cov-fail-under=85 -m 'not e2e and not postgres'"
markers = [
    "e2e: end-to-end tests requiring external services (Mistral API, Temporal)",
    "postgres: tests that run Alembic migrations against a real Postgres via testcontainers (requires Docker)",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "moto[s3]>=5.0",
    "testcontainers[postgres]>=4.0",
]

[tool.mypy]
python_version = "3.12"
files = ["src/forge"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

# networkx ships no type information; treat its imports as untyped at this
# boundary. The internal sibling packages (sax_llm, pbook, forge_contracts) now
# ship py.typed, so they are type-checked against their real signatures.
[[tool.mypy.overrides]]
module = [
    "networkx",
    "networkx.*",
]
ignore_missing_imports = true
