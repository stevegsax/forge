[project]
name = "forge"
version = "0.1.0"
description = "LLM task orchestrator with batch mode execution, planning, and parallel decomposition"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "anthropic>=0.40.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "click>=8.1.0",
    "grimp>=3.5",
    "networkx>=3.0",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "sax-llm",
    "pbook",
    "forge-contracts",
    "sax-platform",
]

[tool.uv.workspace]
# apps/ocr is a member but NOT a forge dependency (apps never import
# apps), so a bare exact `uv sync` won't install it — use
# `uv sync --all-packages` for setup and `uv run --package ocr` to
# invoke it; `uv run`'s inexact sync keeps both coexisting in the venv.
members = ["apps/pbook", "libs/sax-llm", "libs/forge-contracts", "apps/ocr", "libs/sax-platform"]

[tool.uv.sources]
# Every internal package is a workspace member, so a bare checkout (or a
# uvx clone of a tag) is self-contained — Finding A closed (D98). Members
# declare no [tool.uv.sources] of their own.
sax-llm = { workspace = true }
pbook = { workspace = true }
forge-contracts = { workspace = true }
sax-platform = { workspace = true }

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".direnv",
    ".venv",
    ".forge-worktrees",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime, so imports used only as field
# types must stay at module scope (not moved into a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=forge --cov-report=term-missing --cov-fail-under=85 -m 'not e2e and not postgres'"
markers = [
    "e2e: end-to-end tests requiring external services (Mistral API, Temporal)",
    "postgres: tests that run Alembic migrations against a real Postgres via testcontainers (requires Docker)",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "moto[s3]>=5.0",
    "testcontainers[postgres]>=4.0",
    "import-linter>=2.0",
]

[tool.mypy]
python_version = "3.14"
files = ["src/forge"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

# networkx ships no type information; treat its imports as untyped at this
# boundary. The internal sibling packages (sax_llm, pbook, forge_contracts) now
# ship py.typed, so they are type-checked against their real signatures.
[[tool.mypy.overrides]]
module = [
    "networkx",
    "networkx.*",
]
ignore_missing_imports = true

# Import DAG enforcement across the workspace (D87, adapted to the current
# pre-Phase-3 topology by T2.2): apps never import apps, libs never import
# apps or each other. The sax_platform.contracts internal-layering contract
# lands in Phase 3 when that package exists.
[tool.importlinter]
root_packages = ["forge", "pbook", "ocr", "sax_llm", "forge_contracts", "sax_platform"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "pbook and ocr are independent of each other"
type = "independence"
modules = ["pbook", "ocr"]

[[tool.importlinter.contracts]]
name = "apps never import forge"
type = "forbidden"
source_modules = ["pbook", "ocr"]
forbidden_modules = ["forge"]

# forge -> pbook is deliberately allowed until T6.4 deletes forge's
# ingestion side; add pbook to forbidden_modules then.
[[tool.importlinter.contracts]]
name = "forge never imports ocr"
type = "forbidden"
source_modules = ["forge"]
forbidden_modules = ["ocr"]

[[tool.importlinter.contracts]]
name = "libs never import apps or each other"
type = "forbidden"
source_modules = ["sax_llm", "forge_contracts", "sax_platform"]
forbidden_modules = ["forge", "pbook", "ocr"]

# sax_platform replaces both legacy libs across Phase 3; until they are
# retired the three stay mutually independent.
[[tool.importlinter.contracts]]
name = "sax-llm, forge-contracts, and sax-platform are independent"
type = "independence"
modules = ["sax_llm", "forge_contracts", "sax_platform"]

# Precursor of the Phase-3 sax_platform.contracts sandbox-light rule.
# boto3/sqlalchemy stay legal here for now: they are real forge-contracts
# dependencies today (D89 records this).
[[tool.importlinter.contracts]]
name = "forge-contracts never imports LLM SDKs"
type = "forbidden"
source_modules = ["forge_contracts"]
forbidden_modules = ["anthropic", "openai", "mistralai"]
